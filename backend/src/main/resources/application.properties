# LocalLink Detroit — backend configuration
# Secrets are NEVER stored here. Read from environment variables only.

# H2 in-memory datasource — schema.sql is auto-run by Spring Boot
spring.datasource.url=jdbc:h2:mem:locallink;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 auto-runs schema.sql from classpath (Spring Boot default for embedded DBs)
spring.sql.init.mode=always

# Disable H2 web console in all profiles — no UI exposure needed
spring.h2.console.enabled=false

# Jackson: use snake_case for DB field names, camelCase in JSON responses
spring.jackson.default-property-inclusion=non_null

# Granite mode: mock (default) | live
# Override with GRANITE_MODE env var — never change this default to "live"
granite.mode=${GRANITE_MODE:mock}

# Watsonx config — read from env only, no values here
watsonx.url=${WATSONX_URL:}
watsonx.project-id=${WATSONX_PROJECT_ID:}
watsonx.api-key=${WATSONX_API_KEY:}
watsonx.model-id=${WATSONX_MODEL_ID:}

# CORS — allow Angular dev server
spring.web.cors.allowed-origins=http://localhost:4200
